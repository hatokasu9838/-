<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to GARMIN Converter</title>
    <!-- 音楽の圧縮とタグ画像埋め込みに必要な無料外部ライブラリ -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #00ff7f; font-size: 24px; margin-bottom: 5px; }
        .subtitle { font-size: 12px; color: #888; margin-bottom: 25px; }
        label { display: block; text-align: left; font-size: 13px; color: #aaa; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #333; border-radius: 6px; background-color: #2a2a2a; color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 15px; }
        .row div { flex: 1; }
        button { width: 100%; padding: 15px; background-color: #00ff7f; color: #121212; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; transition: background 0.2s; }
        button:hover { background-color: #00cc66; }
        button:disabled { background-color: #555; color: #aaa; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; color: #00ff7f; white-space: pre-line; background: #151515; padding: 12px; border-radius: 6px; border: 1px solid #222; text-align: left; }
        .thumb-preview { width: 150px; height: 150px; object-fit: cover; border-radius: 6px; margin: 15px auto; display: none; border: 2px solid #00ff7f; }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube ➔ GARMIN</h1>
    <div class="subtitle">完全無料・広告なし・音楽切り出しツール</div>
    
    <label for="urlInput">YouTube 動画のURL</label>
    <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
    
    <div class="row">
        <div>
            <label for="startSec">切り出し開始（秒）</label>
            <input type="number" id="startSec" value="0" min="0">
        </div>
        <div>
            <label for="endSec">終了（秒）※0で最後指定</label>
            <input type="number" id="endSec" value="0" min="0">
        </div>
    </div>
    
    <label for="fadeSec">最後のフェードアウト（秒数）</label>
    <input type="number" id="fadeSec" value="5" min="0">
    
    <img id="thumbPreview" class="thumb-preview" alt="Jacket Preview">
    
    <button id="convertBtn" onclick="processAudio()">音楽を処理してダウンロード</button>
    
    <div id="status">URLを入力してボタンを押してください。</div>
</div>

<script>
// YouTubeのURLから動画IDを引っこ抜く関数
function getYouTubeId(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
}

async function processAudio() {
    const url = document.getElementById('urlInput').value;
    const startSec = parseFloat(document.getElementById('startSec').value) || 0;
    const endSec = parseFloat(document.getElementById('endSec').value) || 0;
    const fadeSec = parseFloat(document.getElementById('fadeSec').value) || 0;
    const status = document.getElementById('status');
    const btn = document.getElementById('convertBtn');
    const thumbPreview = document.getElementById('thumbPreview');

    const videoId = getYouTubeId(url);
    if (!videoId) {
        status.innerHTML = "❌ <span style='color:#ff4d4d'>正しいYouTubeのURLを入力してください。</span>";
        return;
    }

    btn.disabled = true;
    status.innerText = "⏳ 1/5: YouTubeから高音質音声の抽出をリクエスト中...";

    // サムネイル画像のプレビュー表示
    const thumbUrl = `https://youtube.com{videoId}/hqdefault.jpg`;
    thumbPreview.src = thumbUrl;
    thumbPreview.style.display = 'block';

    try {
        // 1. Cobaltの無料APIへリクエストを送信
        const cobaltApi = "https://api.cobalt.tools/";
        const response = await fetch(cobaltApi, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ url: url, downloadMode: "audio", audioFormat: "mp3" })
        });
        
        const json = await response.json();
        if (!json.url) throw new Error("APIからの音声URL取得に失敗しました。");

        status.innerText = "⏳ 2/5: 音声バイナリデータをダウンロード中...";

        // CORS回避用プロキシを挟んでブラウザに音楽ファイルをロード
        const proxyUrl = `https://corsproxy.io{encodeURIComponent(json.url)}`;
        const audioFetch = await fetch(proxyUrl);
        const audioBufferData = await audioFetch.arrayBuffer();

        status.innerText = "⏳ 3/5: ブラウザ内で音声の波形データを解析中...";
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedBuffer = await audioCtx.decodeAudioBuffer(audioBufferData);

        status.innerText = "⏳ 4/5: 指定位置での切り取り ＆ フェードアウト処理を適用中...";
        
        // 切り取り計算
        const sampleRate = decodedBuffer.sampleRate;
        const startOffset = startSec * sampleRate;
        let frameCount = decodedBuffer.length - startOffset;
        if (endSec > 0 && endSec > startSec) {
            frameCount = (endSec - startSec) * sampleRate;
        }
        frameCount = Math.min(frameCount, decodedBuffer.length - startOffset);
        
        // 編集用の一時バッファを作成
        const editedBuffer = audioCtx.createBuffer(decodedBuffer.numberOfChannels, frameCount, sampleRate);
        
        // データを複製しつつ、終わりの部分にフェードアウト処理を実行
        for (let channel = 0; channel < decodedBuffer.numberOfChannels; channel++) {
            const srcData = decodedBuffer.getChannelData(channel);
            const dstData = editedBuffer.getChannelData(channel);
            
            for (let i = 0; i < frameCount; i++) {
                const sourceIndex = i + startOffset;
                let volume = 1.0;
                
                // フェードアウト判定
                const remainingSec = (frameCount - i) / sampleRate;
                if (remainingSec < fadeSec && fadeSec > 0) {
                    volume = remainingSec / fadeSec;
                }
                dstData[i] = srcData[sourceIndex] * volume;
            }
        }

        status.innerText = "⏳ 5/5: GARMIN向けにMP3圧縮 ＆ ジャケット写真を合成中...\n（少し時間がかかります）";

        // サムネイル画像のバイナリデータを取得
        const thumbFetch = await fetch(`https://corsproxy.io{encodeURIComponent(thumbUrl)}`);
        const thumbBuffer = await thumbFetch.arrayBuffer();

        // 2. lamejsを使用してブラウザ上でMP3へ高速エンコード（192kbps）
        const mp3Blob = bufferToMp3(editedBuffer, 192);
        const mp3ArrayBuffer = await mp3Blob.arrayBuffer();

        // 3. ID3WriterでMP3にタイトルとジャケット画像を書き込み
        const writer = new ID3Writer(mp3ArrayBuffer);
        writer.setFrame('TIT2', 'Garmin_Track_' + videoId)
              .setFrame('APIC', {
                  type: 3,
                  data: thumbBuffer,
                  description: 'Cover Artwork',
                  useMediumUrl: false
              });
        writer.addTag();

        // 生成された最終ファイルを自動ダウンロード
        const finalBlob = writer.getBlob();
        const downloadUrl = URL.createObjectURL(finalBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `Garmin_Audio_${videoId}.mp3`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        status.innerHTML = "✨ <span style='color:#00ff7f; font-weight:bold;'>大成功！保存されました。</span>\nPCにGARMINを接続し、Garmin Expressで転送してください！";
    } catch (error) {
        console.error(error);
        status.innerHTML = "❌ <span style='color:#ff4d4d'>処理中にエラーが起きました。</span>\n・長すぎる動画は非対応な場合があります。\n・時間をおいてもう一度試してみてください。";
    } finally {
        btn.disabled = false;
    }
}

// AudioBufferをMP3バイナリBlobにエンコードするヘルパー
function bufferToMp3(audioBuffer, bitrate) {
    const channels = audioBuffer.numberOfChannels;
    const sampleRate = audioBuffer.sampleRate;
    const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, bitrate);
    const mp3Data = [];

    const sampleBlockSize = 1152;
    const left = audioBuffer.getChannelData(0);
    const right = channels > 1 ? audioBuffer.getChannelData(1) : left;

    for (let i = 0; i < left.length; i += sampleBlockSize) {
        const leftChunk = left.subarray(i, i + sampleBlockSize);
        const rightChunk = right.subarray(i, i + sampleBlockSize);
        
        const leftInt16 = new Int16Array(leftChunk.length);
        const rightInt16 = new Int16Array(rightChunk.length);
        
        for (let j = 0; j < leftChunk.length; j++) {
            leftInt16[j] = Math.max(-1, Math.min(1, leftChunk[j])) * 0x7FFF;
            rightInt16[j] = Math.max(-1, Math.min(1, rightChunk[j])) * 0x7FFF;
        }

        const mp3buf = mp3encoder.encodeBuffer(leftInt16, rightInt16);
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
    }
    
    const mp3buf = mp3encoder.flush();
    if (mp3buf.length > 0) mp3Data.push(mp3buf);
    
    return new Blob(mp3Data, { type: 'audio/mp3' });
}
</script>
</body>
</html>
